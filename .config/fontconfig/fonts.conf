<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- There was no fontconfig here at all before, so only GTK apps got any
       rendering policy (from gtk-3.0/settings.ini) and everything else fell
       through to the distro defaults. This makes the policy global and keeps
       it in sync with those two settings.ini files. -->

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <!-- Grayscale. The bar, swaync and swayosd are all translucent surfaces;
         subpixel filtering fringes on those. See gtk-3.0/settings.ini. -->
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>

  <!-- `monospace` is what the panel stylesheets fall back to, so point it at
       the face they actually want rather than letting it land on DejaVu.
       Deliberately not aliasing sans-serif — that would push every web page
       and Qt dialog into a monospace face too. -->
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>

</fontconfig>
