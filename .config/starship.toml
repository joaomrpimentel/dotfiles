"$schema" = 'https://starship.rs/config-schema.json'

format = """\
[](fg:#fabd2f)\
$os\
$username\
[](bg:#3c3836 fg:#fabd2f)\
$directory\
[](fg:#3c3836 bg:#504945)\
$git_branch\
$git_status\
[](fg:#504945 bg:#665c54)\
$nodejs\
$python\
$rust\
$golang\
$lua\
$java\
$docker_context\
[](fg:#665c54) \
$character"""

add_newline = false

[os]
disabled = false
style = "bg:#fabd2f fg:#282828"

[os.symbols]
Arch = " "
Macos = " "
Linux = " "
Ubuntu = " "
Debian = " "
Fedora = " "
Windows = " "

[username]
show_always = false
style_user = "bg:#fabd2f fg:#282828"
style_root = "bg:#fabd2f fg:#cc241d"
format = '[ $user ]($style)'

[directory]
style = "bg:#3c3836 fg:#ebdbb2"
format = "[ $path ]($style)"
truncation_length = 1
truncation_symbol = ""
truncate_to_repo = false
read_only = " "

[directory.substitutions]
"~" = " home"

[git_branch]
symbol = ""
style = "bg:#504945 fg:#ebdbb2"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#504945 fg:#fb4934"
format = '[$all_status$ahead_behind ]($style)'

[nodejs]
symbol = ""
style = "bg:#665c54 fg:#b8bb26"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = ""
style = "bg:#665c54 fg:#fabd2f"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#665c54 fg:#fe8019"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = ""
style = "bg:#665c54 fg:#83a598"
format = '[ $symbol ($version) ]($style)'

[lua]
symbol = ""
style = "bg:#665c54 fg:#83a598"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = ""
style = "bg:#665c54 fg:#fb4934"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = ""
style = "bg:#665c54 fg:#83a598"
format = '[ $symbol $context ]($style)'

[line_break]
disabled = false

[character]
success_symbol = '[](bold #b8bb26)'
error_symbol   = '[](bold #fb4934)'
vimcmd_symbol  = '[](bold #b8bb26)'

[cmd_duration]
min_time = 1000
format = '[ took $duration]($style)'
style = "fg:#928374"
