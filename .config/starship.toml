"$schema" = 'https://starship.rs/config-schema.json'

# Monochrome, no powerline blocks. Two lines: context, then the prompt.
format = """
$directory\
$git_branch\
$git_status\
$nodejs$python$rust$golang$lua$java$docker_context\
$cmd_duration\
$line_break\
$character"""

# No blank line between the last command's output and the prompt.
add_newline = false

[directory]
style = "bold #ffffff"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " ro"
read_only_style = "#6e6e6e"

[directory.substitutions]
"~" = "~"

[git_branch]
symbol = ""
style = "#a2a2a2"
format = '[$symbol$branch]($style) '

[git_status]
style = "#6e6e6e"
format = '[$all_status$ahead_behind]($style) '
conflicted = "!"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕"
untracked = "?"
stashed = "\\$"
modified = "*"
staged = "+"
renamed = "»"
deleted = "-"

[nodejs]
symbol = "node "
style = "#6e6e6e"
format = '[$symbol($version)]($style) '

[python]
symbol = "py "
style = "#6e6e6e"
format = '[$symbol($version)]($style) '

[rust]
symbol = "rs "
style = "#6e6e6e"
format = '[$symbol($version)]($style) '

[golang]
symbol = "go "
style = "#6e6e6e"
format = '[$symbol($version)]($style) '

[lua]
symbol = "lua "
style = "#6e6e6e"
format = '[$symbol($version)]($style) '

[java]
symbol = "java "
style = "#6e6e6e"
format = '[$symbol($version)]($style) '

[docker_context]
symbol = "docker "
style = "#6e6e6e"
format = '[$symbol$context]($style) '

[cmd_duration]
min_time = 1000
style = "#6e6e6e"
format = '[took $duration]($style) '

[line_break]
disabled = false

[character]
success_symbol = '[❯](#ffffff)'
error_symbol   = '[❯](#ff5555)'
vimcmd_symbol  = '[❮](#a2a2a2)'

[os]
disabled = true

[username]
disabled = true
