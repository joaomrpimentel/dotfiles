[Settings]
# Adwaita is the only neutral dark theme installed; the monochrome accents come
# from gtk.css next to this file. (Gruvbox-Material-Dark was what made every
# file dialog, Thunar window and nm-applet menu the odd one out.)
gtk-theme-name=Adwaita
gtk-icon-theme-name=Adwaita
gtk-font-name=JetBrainsMono Nerd Font 10
gtk-cursor-theme-name=default
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=1
gtk-toolbar-style=GTK_TOOLBAR_ICONS
gtk-toolbar-icon-size=GTK_ICON_SIZE_LARGE_TOOLBAR
gtk-button-images=0
gtk-menu-images=0
gtk-enable-event-sounds=1
gtk-enable-input-feedback-sounds=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
# Grayscale, not subpixel. Waybar/swaync/swayosd all draw onto translucent
# surfaces that Hyprland blends afterwards; RGB subpixel filtering assumes an
# opaque backdrop and leaves colour fringes on the glyph edges when it doesn't
# get one. Set this back to `rgb` only if every panel goes opaque.
gtk-xft-rgba=none
