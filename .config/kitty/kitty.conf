shell /usr/bin/zsh --login

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0

# Window Configuration
window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0

# Translucent — Hyprland's blur is what fills in behind it
background_opacity 0.75
dynamic_background_opacity yes

cursor_shape beam
cursor_blink_interval 0

# Monochrome base
foreground            #ffffff
background            #0c0c0c
selection_foreground  #0c0c0c
selection_background  #a2a2a2
cursor                #ffffff
cursor_text_color     #0c0c0c
url_color             #a2a2a2

# ANSI palette: desaturated, not grayscale. Pure gray would flatten diffs,
# syntax highlighting and ls output into an unreadable smear — these keep the
# hue distinctions while staying quiet enough to read as monochrome.
# black
color0   #1a1a1a
color8   #4a4a4a

# red
color1   #b56a6a
color9   #d98d8d

# green
color2   #8fa88f
color10  #a9c4a9

# yellow
color3   #b3a884
color11  #d4c9a3

# blue
color4   #7d90a3
color12  #9db0c4

# magenta
color5   #a087a8
color13  #c0a6c8

# cyan
color6   #7fa3a3
color14  #9fc4c4

# white
color7   #a2a2a2
color15  #ffffff
