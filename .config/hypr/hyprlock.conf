###################
### HYPRLOCK ###
###################
# Gruvbox-themed lock screen. Bound to Super+L.

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.15
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(235, 219, 178, 1.0)
    font_size = 110
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color = rgba(235, 219, 178, 0.9)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# User
label {
    monitor =
    text =   $USER
    color = rgba(250, 189, 47, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(250, 189, 47, 1.0)
    inner_color = rgba(40, 40, 40, 0.85)
    font_color = rgba(235, 219, 178, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##ebdbb2cc">Password...</span>
    hide_input = false
    rounding = 12
    check_color = rgba(184, 187, 38, 1.0)
    fail_color = rgba(204, 36, 29, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(254, 128, 25, 1.0)
    position = 0, -130
    halign = center
    valign = center
}
