###################
### HYPRLOCK ###
###################
# Monochrome lock screen. Bound to Super+L.

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 9
    noise = 0.015
    contrast = 0.85
    brightness = 0.55
    vibrancy = 0.0
    vibrancy_darkness = 0.4
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 1.0)
    font_size = 120
    font_family = JetBrainsMono Nerd Font Light
    position = 0, 170
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color = rgba(162, 162, 162, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.65)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -50
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 300, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.18)
    inner_color = rgba(20, 20, 20, 0.55)
    font_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##a2a2a2">password</span>
    hide_input = false
    rounding = 23
    check_color = rgba(255, 255, 255, 0.35)
    fail_color = rgba(255, 85, 85, 1.0)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = rgba(255, 255, 255, 0.55)
    position = 0, -120
    halign = center
    valign = center
}
