# Real glass — hyprglass plugin.
#
# Sourced from hyprland.conf. It stayed detached until the plugin was actually
# installed, because Hyprland treats unknown `plugin:` keys as config errors and
# sourcing it before `hyprpm enable` would just fill configerrors with noise.
#
# Pinned build: your Hyprland is 0.55.2 at commit 39d7e209, which hyprglass's
# hyprpm.toml pins to hyprglass v0.6.2 (commit f30a1962). That pairing is
# declared upstream, so hyprpm builds against your exact headers rather than
# guessing.
#
# Hyprland's own layer blur stays enabled in the layerrules. That was measured,
# not assumed: with glass active, toggling it moves the mean channel value by
# 0.05 where the glass itself moves it by 17.8, i.e. this render path replaces
# Hyprland's blur rather than compounding it. Leaving it on costs nothing
# visible and keeps a working fallback if the plugin stops loading.
#
# What this adds over the CSS version: the CSS fakes a lit edge with a
# gradient. This actually samples the framebuffer behind the surface and bends
# it at the edges — refraction, chromatic aberration, a real fresnel rim. The
# CSS sheen stays underneath as the diffuse base; the plugin adds the optics.

plugin {
    hyprglass {
        # Windows: OFF. This is the global switch and it covers app windows, not
        # the panels. It was on, which glassed every translucent window — kitty
        # runs at background_opacity 0.75 — and since Hyprland draws its own
        # decoration:shadow around each one, that shadow got rendered as glass.
        # That's where the spreading blobs came from.
        #
        # Layer glass does NOT read this flag. The renderLayer hook checks only
        # layers:enabled (verified: toggling this key moves the bar by 0.000),
        # so the panels below stay glassed with this off.
        enabled = false
        default_theme = dark

        # Presets available in v0.6.2: subtle, clear, glass, high_contrast.
        # `subtle` is blurStrength 1.0 / refraction 0.3 / aberration 0.2 —
        # the closest to the panels' current weight. `clear` is the same optics
        # with blur at 0, which reads as plastic film over a busy wallpaper.
        default_preset = subtle

        # Edge optics. The first pass of these was far too timid to see:
        # refraction 0.35 is barely above the `subtle` preset's own 0.3, so the
        # plugin was running and doing almost nothing visible. For reference the
        # built-in `high_contrast` preset uses refraction 1.2 / lens 0.5.
        #
        # Refraction and lens_distortion are what actually bend the wallpaper
        # through the panel, so they carry the effect. Aberration stays low on
        # purpose: at ~81dpi the RGB split lands on whole pixels and reads as
        # colour fringing on text rather than a prism.
        refraction_strength  = 1.00
        lens_distortion      = 0.45
        chromatic_aberration = 0.10
        fresnel_strength     = 0.55
        specular_strength    = 0.70
        # Thinner edge = a tighter, brighter refractive band. 0.15 spread the
        # bending so wide across a 28px-tall pill that it averaged out to
        # nothing; high_contrast uses 0.06 for the same reason.
        edge_thickness       = 0.08

        # Transparency. blur_strength defaults to 2.0, which frosts the panel
        # so heavily that nothing behind it survives to be refracted — the
        # effect was there, it just had nothing to bend. Dropping it lets the
        # wallpaper through, which is what makes the refraction legible.
        blur_strength = 0.60
        glass_opacity = 0.85

        # Legibility. A flat tint can't win here: dark enough to read white text
        # over snow is too dark to see through over water. adaptive_dim scales
        # the dimming with how bright the sampled background actually is, so the
        # panel stays clear over dark wallpaper and pulls down only where the
        # text would otherwise be lost. That's what carries contrast now instead
        # of the stylesheet alpha.
        dark {
            brightness        = 1.0
            adaptive_dim      = 0.45
            vibrancy_darkness = 0.10
        }

        layers {
            enabled = true

            # Whitelist. Empty would mean *every* layer surface, which catches
            # the wallpaper and the workspace-dots animation mid-slide.
            # wallpaper-picker is deliberately absent: its surface is a
            # fullscreen scrim, so glassing it frosts the whole screen rather
            # than a panel.
            namespaces = waybar,dots,swaync-control-center,swaync-notification-window,walker,wofi,swayosd

            # The plugin masks on surface alpha and layer shadows count as
            # visible content, which is what produced the soft glass blob around
            # walker and swaync: it was rendering their `0 20px 48px` drop
            # shadows as glass. Raising the cutoff only trades the blob for a
            # hard-edged panel, so the shadows were removed from the
            # stylesheets instead and every surface can now use a low cutoff.
            #
            # Keep this below the panel tint (0.24) or the panels stop being
            # glassed entirely.
            # swaync-notification-window needs a much higher cutoff than the
            # rest and was missing from this list entirely, so it fell back to
            # the 0.001 default. Its surface is a 380x1046 column running the
            # full height of the screen, not a toast-sized box — so a near-zero
            # cutoff means any almost-invisible repaint anywhere in that column
            # glasses the whole right-hand side of the display. That is the
            # intermittent flash. The toast body sits at 0.28 alpha, so 0.20
            # accepts the toast and rejects everything fainter.
            namespace_mask_thresholds = waybar=0.05,dots=0.05,swaync-control-center=0.05,walker=0.05,wofi=0.05,swayosd=0.05,swaync-notification-window=0.20
        }
    }
}
