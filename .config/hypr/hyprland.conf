#################
### VARIABLES ###
#################
env = XMODIFIERS,@im=cedilla
env = GTK_IM_MODULE,xim
env = QT_IM_MODULE,xim
$mainMod = SUPER
$terminal = kitty
$browser = vivaldi-stable
$menu = walker -N -H
$sidebar = swaync-client -t -sw
env = GTK_THEME,Adwaita:dark
env = XDG_MENU_PREFIX,arch-
env = QT_QPA_PLATFORMTHEME,qt6ct   # Communicates theme to Qt apps


#################
### AUTOSTART ###
#################
# xdg-desktop-portal and libadwaita apps read gsettings, not settings.ini
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Adwaita'
exec-once = gsettings set org.gnome.desktop.interface font-name 'JetBrainsMono Nerd Font 10'
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = ~/.config/waybar/scripts/bar_mode.sh --restore
exec-once = swaync
exec-once = swayosd-server
exec-once = nm-applet --indicator
exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store
exec-once = awww-daemon
exec-once = waypaper --restore    # Restores wallpaper from Waypaper
exec-once = elephant               # Walker provider daemon
exec-once = walker --gapplication-service  # Walker service for instant launch
exec-once = ~/.config/hypr/scripts/workspace_dots.py  # Ephemeral workspace dots (owns its own waybar)
exec-once = hyprpm reload -n   # Load hyprglass; -n suppresses the notification popup



#####################
### LOOK AND FEEL ###
#####################

# Monochrome palette (see .config/PALETTE.md)
$mono_fg      = rgba(ffffffff)
$mono_dim     = rgba(a2a2a2ff)
$mono_border  = rgba(ffffff33)
$mono_border0 = rgba(ffffff0d)
$mono_urgent  = rgba(ff5555ff)

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = $mono_border
    col.inactive_border = $mono_border0
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 10
    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(00000066)
    }
    # Glass. The stylesheets draw the specular edge; this draws the material
    # behind it. Both halves are needed — a bright rim over a thin blur reads
    # as a sticker, and a deep blur with no rim reads as fog.
    blur {
        enabled = true
        # Down from size 8 / passes 4, which was where the waybar pills grew a
        # blur halo escaping past their rounded edges. Hyprland's blur runs as a
        # downsample/upsample chain, so passes is a power of two on the sampling
        # radius: 8 * 2^4 is a ~128px kernel against a 28px-tall pill, and the
        # alpha mask that is supposed to clip it is only evaluated at the
        # downscaled resolution. The mask cannot follow a 14px corner radius at
        # 1/16 scale, so the blur leaks outward.
        #
        # Bisected, not guessed. Raising hyprglass's waybar mask threshold
        # (0.05 -> 0.20) changed nothing, and zeroing its lens_distortion and
        # fresnel_strength changed nothing — so the plugin's edge optics were
        # not drawing the halo, they were only making the leak underneath them
        # visible. This is the line that removed it.
        #
        # Cost: this block is global, so kitty's backdrop gets the same lighter
        # blur. brightness = 1.35 below already carries most of kitty's weight.
        size = 4
        passes = 2
        # The stylesheets dropped to ~0.42 alpha to let more of this through,
        # so the noise has to come down or it reads as grain on the text.
        noise = 0.006
        contrast = 1.05
        # Vibrancy keeps the wallpaper's colour alive through the blur, which
        # otherwise averages out to grey. Darkness holds the pill down so white
        # text keeps its contrast over a bright wallpaper.
        vibrancy = 0.32
        vibrancy_darkness = 0.28
        # Windows only — hyprglass owns the layer render path, so this moves
        # kitty without touching the panels (measured: kitty 39.7 -> 46.4,
        # waybar 182.9 -> 182.7). It compensates for the backdrop sitting
        # under kitty's own 0.75 alpha over a near-black #0c0c0c, which is
        # what actually reads as "not translucent enough".
        brightness = 1.35
        # Popups are layer surfaces too — without this the walker menus get
        # the stylesheet's rim but none of the material under it.
        popups = true
    }
}

# Real glass. Sourced only now that the plugin is installed — see the header
# of that file for why it stayed detached until then.
source = ~/.config/hypr/hyprglass.conf

animations {
    enabled = true
    bezier = easeOut, 0.05, 0.9, 0.1, 1.0
    animation = windows,    1, 4, easeOut
    animation = windowsOut, 1, 4, easeOut
    animation = border,     1, 6, default
    animation = fade,       1, 4, default
    animation = workspaces, 1, 4, easeOut, slide
    animation = layers,     1, 3, easeOut, slide
    animation = layersIn,   1, 3, easeOut, slide
    animation = layersOut,  1, 3, easeOut, slide
}

# Blur the translucent surfaces, and give layer surfaces their slide.
# `slide` with no direction picks the direction from the layer's anchor, so the
# workspace dots slide up out of the bottom edge every time they pop.
layerrule {
  name = Bar
  match:namespace = ^(waybar)$
  # Kept on deliberately. Measured: with hyprglass active this makes no visual
  # difference (mean channel delta 0.05, against 17.8 for the glass itself) —
  # the plugin's render path replaces Hyprland's blur rather than stacking with
  # it. It stays enabled so that if the plugin ever fails to load, which is the
  # normal outcome of a Hyprland update, the panels fall back to the CSS glass
  # look instead of going flat translucent.
  blur = true
  ignore_alpha = 0.2
}

layerrule {
  name = Workspace Dots
  match:namespace = ^(dots)$
  blur = true    # fallback if the plugin is unloaded — see the Bar rule
  ignore_alpha = 0.2
  animation = slide
}

layerrule {
  name = Translucent Popups
  match:namespace = ^(swaync-control-center|swaync-notification-window|walker|wofi|swayosd|wallpaper-picker)$
  blur = true    # fallback if the plugin is unloaded — see the Bar rule
  ignore_alpha = 0.2
}

#############
### INPUT ###
#############
monitor = , preferred, auto, 1

input {
    # Teclado ABNT2 (pt-br)
    kb_layout = br
    kb_variant = abnt2
    numlock_by_default = true
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
}

###################
### KEYBINDINGS ###
###################

# Apps e Utilidades
bind = $mainMod, T, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, E, exec, thunar
bind = $mainMod, N, exec, $sidebar
bind = $mainMod, V, exec, ~/.config/walker/scripts/clipboard.sh
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper_picker.py
bind = CONTROL ALT, Delete, exec, ~/.config/wofi/scripts/powermenu.sh
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, P, exec, ~/.config/waybar/scripts/bar_mode.sh   # normal -> por baixo -> oculta

# Menu de Apps (Apenas a tecla SUPER)
bindr = $mainMod, SUPER_L, exec, $menu

# Gestão de Janelas
bind = $mainMod, Q, killactive, 
bind = $mainMod, F, fullscreen, 0
bind = $mainMod ALT, F, exec, ~/.config/hypr/scripts/toggle_float.sh

# Resize floating windows with keyboard (Super + Ctrl + Arrow keys)
binde = $mainMod CTRL, right, resizeactive, 30 0
binde = $mainMod CTRL, left, resizeactive, -30 0
binde = $mainMod CTRL, up, resizeactive, 0 -30
binde = $mainMod CTRL, down, resizeactive, 0 30

# Printscreen (Super + Shift + S) -> Vai pro clipboard
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh

# Toggle monitor resolution (Super + Shift + R) -> 2560x1080 <-> 1920x1080 for recording
bind = $mainMod SHIFT, R, exec, ~/.config/hypr/scripts/toggle_resolution.sh

# Navegação de Workspaces (1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover janela silenciosamente para Workspace (Super + Alt + 0-9)
bind = $mainMod ALT, 1, movetoworkspacesilent, 1
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5
bind = $mainMod ALT, 6, movetoworkspacesilent, 6
bind = $mainMod ALT, 7, movetoworkspacesilent, 7
bind = $mainMod ALT, 8, movetoworkspacesilent, 8
bind = $mainMod ALT, 9, movetoworkspacesilent, 9
bind = $mainMod ALT, 0, movetoworkspacesilent, 10

# Mover janela e ir para Workspace (Super + Shift + 0-9)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle

# Brilho (Opcional, mas fica combinando)
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Misc
misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

# Weather Satellite Popup Rules
# windowrule = class:^(WeatherSatellite)$, float 1
# windowrule = class:^(WeatherSatellite)$, pin 1
# windowrule = class:^(WeatherSatellite)$, center 1
# windowrule = class:^(WeatherSatellite)$, size 800 800

windowrule {
  name = Weather Satellite View
  match:class = WeatherSatellite
  float = true
  pin = true
  move = (monitor_w-510) 44
  size = 500 500
}

# Calendar popup (waybar clock click) -> float top-center under bar
windowrule {
  name = Calendar Popup
  match:class = gsimplecal
  float = true
  pin = true
  move = (monitor_w/2-120) 44
}

# Reading tier, 0.75 (see PALETTE.md). Zathura ignores alpha on the recolored
# page, so per-color rgba in zathurarc leaves the page solid while the frame
# goes glass. Fading the whole window is the only way it matches kitty.
windowrule {
  name = Zathura Glass
  match:class = org.pwmt.zathura
  opacity = 0.75 0.75
}
